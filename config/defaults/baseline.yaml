run:
  command: train
  seed: 42
  output_dir: logs/run-001

distributed:
  backend: nccl
  data_parallel_size: 1

model:
  name: NousResearch/Llama-3.2-1B
  dtype: bfloat16

data:
  dataset_name: teknium/GPT4-LLM-Cleaned
  context_length: 512
  num_sequences: 1024

training:
  batch_size: 1
  grad_accum: 1
  max_steps: 10
  learning_rate: 0.00002
  weight_decay: 0.0
